name: Update incentives & publish site

on:
  schedule:
    # Daily at 13:00 UTC (~6-7am Mountain). Cron is always UTC.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # Maintainer can run on demand from the Actions tab
  push:
    branches: [main]      # Rebuild on code changes too

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes overlap; a newer run supersedes an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scanner (builds site/)
        run: python fetch_incentives.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Turn on Pages (GitHub Actions source) automatically

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
